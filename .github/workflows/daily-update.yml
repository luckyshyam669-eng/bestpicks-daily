name: Daily Products Auto Update

on:
  schedule:
    - cron: '0 6 * * *'  # Har roz 6:00 AM UTC = 11:30 AM IST
  workflow_dispatch:       # Manual trigger bhi possible

jobs:
  update-products:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Fresh Products
        run: |
          python3 << 'PYEOF'
          import json
          import random
          from datetime import datetime

          ASSOCIATE_ID = "sunilkumar-20"

          PRODUCTS = {
            "electronics": [
              {"asin": "B09B8YWXDF", "title": "Echo Dot (5th Gen) Smart Speaker with Alexa", "price": "$49.99", "rating": "4.7", "category": "Electronics", "badge": "Best Seller", "image": "https://m.media-amazon.com/images/I/51yHDOcvGAL._AC_SX679_.jpg"},
              {"asin": "B08N5WRWNW", "title": "Fire TV Stick 4K Streaming Device", "price": "$49.99", "rating": "4.7", "category": "Electronics", "badge": "#1 Best Seller", "image": "https://m.media-amazon.com/images/I/51TjJOTfslL._AC_SX679_.jpg"},
              {"asin": "B0BDHX8Z63", "title": "Apple AirPods Pro (2nd Generation)", "price": "$189.00", "rating": "4.8", "category": "Electronics", "badge": "Top Rated", "image": "https://m.media-amazon.com/images/I/61f1YfTkTDL._AC_SX679_.jpg"},
              {"asin": "B07XJ8C8F7", "title": "Kindle Paperwhite (16 GB)", "price": "$139.99", "rating": "4.7", "category": "Electronics", "badge": "Trending", "image": "https://m.media-amazon.com/images/I/61pFXKiymzL._AC_SX679_.jpg"},
              {"asin": "B08MQZXN1X", "title": "Ring Video Doorbell", "price": "$99.99", "rating": "4.6", "category": "Electronics", "badge": "Popular", "image": "https://m.media-amazon.com/images/I/61lHJmGxGFL._AC_SX679_.jpg"},
              {"asin": "B07VGRJDFY", "title": "Bose QuietComfort 45 Headphones", "price": "$279.00", "rating": "4.6", "category": "Electronics", "badge": "Premium Pick", "image": "https://m.media-amazon.com/images/I/51JOMFAKs5L._AC_SX679_.jpg"},
            ],
            "home": [
              {"asin": "B094DKCZXP", "title": "Instant Pot Duo 7-in-1 Electric Pressure Cooker", "price": "$79.95", "rating": "4.7", "category": "Home & Kitchen", "badge": "#1 Best Seller", "image": "https://m.media-amazon.com/images/I/71y2tJIVFXL._AC_SX679_.jpg"},
              {"asin": "B07XTQNKSR", "title": "Ninja AF101 Air Fryer 4 Quart", "price": "$89.99", "rating": "4.7", "category": "Home & Kitchen", "badge": "Best Seller", "image": "https://m.media-amazon.com/images/I/61VJmCMhvZL._AC_SX679_.jpg"},
              {"asin": "B01NBKTPTS", "title": "Waterpik Aquarius Professional Water Flosser", "price": "$49.99", "rating": "4.7", "category": "Home & Kitchen", "badge": "Top Rated", "image": "https://m.media-amazon.com/images/I/51GtRpBm2nL._AC_SX679_.jpg"},
              {"asin": "B08Y5KQN1H", "title": "iRobot Roomba i3 Robot Vacuum", "price": "$249.99", "rating": "4.5", "category": "Home & Kitchen", "badge": "Trending", "image": "https://m.media-amazon.com/images/I/61WtdGFDl0L._AC_SX679_.jpg"},
            ],
            "health": [
              {"asin": "B07FZ8S74R", "title": "Fitbit Inspire 3 Health & Fitness Tracker", "price": "$79.95", "rating": "4.5", "category": "Health & Personal Care", "badge": "Trending", "image": "https://m.media-amazon.com/images/I/51I0nNVNL3L._AC_SX679_.jpg"},
              {"asin": "B0CJ5J6C9Q", "title": "Vicks Warm Mist Humidifier", "price": "$34.97", "rating": "4.5", "category": "Health & Personal Care", "badge": "Best Seller", "image": "https://m.media-amazon.com/images/I/71vFBiaCbNL._AC_SX679_.jpg"},
              {"asin": "B078SWJMV3", "title": "Omron Blood Pressure Monitor", "price": "$54.99", "rating": "4.6", "category": "Health & Personal Care", "badge": "Top Rated", "image": "https://m.media-amazon.com/images/I/51oVpBJcxHL._AC_SX679_.jpg"},
            ],
            "sports": [
              {"asin": "B09X7CRKRZ", "title": "Hydro Flask Wide Mouth Water Bottle 32 oz", "price": "$44.95", "rating": "4.8", "category": "Sports & Outdoors", "badge": "Top Rated", "image": "https://m.media-amazon.com/images/I/61qp7hpGiuL._AC_SX679_.jpg"},
              {"asin": "B00BEYXJF0", "title": "TRX All-in-One Suspension Training", "price": "$139.95", "rating": "4.7", "category": "Sports & Outdoors", "badge": "Best Seller", "image": "https://m.media-amazon.com/images/I/81iiCqTjBKL._AC_SX679_.jpg"},
              {"asin": "B07G3QNXZQ", "title": "Resistance Bands Set for Exercise", "price": "$29.99", "rating": "4.6", "category": "Sports & Outdoors", "badge": "Popular", "image": "https://m.media-amazon.com/images/I/71GBqEFIkwL._AC_SX679_.jpg"},
            ]
          }

          # Sab products ek pool mein
          pool = []
          for cat_products in PRODUCTS.values():
              pool.extend(cat_products)

          # Random 9 products select karo (daily variety ke liye)
          random.shuffle(pool)
          selected = pool[:9]

          # Affiliate links add karo
          for p in selected:
              p["affiliateLink"] = f"https://www.amazon.com/dp/{p['asin']}?tag={ASSOCIATE_ID}"

          output = {
              "lastUpdated": datetime.utcnow().isoformat() + "Z",
              "associateId": ASSOCIATE_ID,
              "totalProducts": len(selected),
              "products": selected,
              "categories": [
                  {"name": "Electronics", "slug": "electronics"},
                  {"name": "Home & Kitchen", "slug": "home-kitchen"},
                  {"name": "Health & Personal Care", "slug": "health"},
                  {"name": "Sports & Outdoors", "slug": "sports"}
              ]
          }

          import os
          os.makedirs("data", exist_ok=True)
          with open("data/products.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"✅ {len(selected)} products updated at {output['lastUpdated']}")
          PYEOF

      - name: Commit & Push Updated Products
        run: |
          git config user.name "BestPicksBot"
          git config user.email "bot@bestpicksdaily.com"
          git add data/products.json
          git diff --staged --quiet || git commit -m "🔄 Daily auto update: $(date +'%d %b %Y, %I:%M %p IST')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
